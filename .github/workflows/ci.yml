name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shepherd
          POSTGRES_PASSWORD: shepherd-ci
          POSTGRES_DB: shepherd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shepherd -d shepherd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shepherd:shepherd-ci@127.0.0.1:5432/shepherd_test
      DIRECT_URL: postgresql://shepherd:shepherd-ci@127.0.0.1:5432/shepherd_test
      NEXTAUTH_SECRET: ci-build-secret-that-is-long-enough
      QUOTA_ACTOR_SECRET: ci-quota-secret-that-is-long-enough
      RATE_LIMIT_SECRET: ci-rate-limit-secret-that-is-long-enough
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
